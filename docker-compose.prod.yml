services:
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: batalhanaval-api
    env_file:
      - .env
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3333
    expose:
      - "3333"
    networks:
      - batalhanaval
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3333/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_WS_URL: ${VITE_WS_URL:-https://localhost}
        VITE_API_URL: ${VITE_API_URL:-https://localhost}
    container_name: batalhanaval-frontend
    expose:
      - "80"
    networks:
      - batalhanaval
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    container_name: batalhanaval-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./certbot/www:/var/www/certbot:ro
      - ./certbot/conf:/etc/letsencrypt:ro
    depends_on:
      - api
      - frontend
    networks:
      - batalhanaval
    restart: unless-stopped

  certbot:
    image: certbot/certbot:latest
    container_name: batalhanaval-certbot
    volumes:
      - ./certbot/www:/var/www/certbot
      - ./certbot/conf:/etc/letsencrypt
    entrypoint: /bin/sh -c
    command: >-
      "trap exit TERM;
      while :; do
        certbot renew --webroot -w /var/www/certbot --quiet;
        sleep 12h & wait $${!};
      done"
    networks:
      - batalhanaval
    restart: unless-stopped

networks:
  batalhanaval:
    driver: bridge
