services:
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: batalhanaval-api
    env_file:
      - .env
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3333
    ports:
      # Só localhost: o Nginx do host faz o proxy público (80/443)
      - "127.0.0.1:3333:3333"
    networks:
      - batalhanaval
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3333/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_WS_URL: ${VITE_WS_URL:-https://batalha.marcelokevin.com.br}
        VITE_API_URL: ${VITE_API_URL:-https://batalha.marcelokevin.com.br}
    container_name: batalhanaval-frontend
    ports:
      - "127.0.0.1:3080:80"
    networks:
      - batalhanaval
    restart: unless-stopped

networks:
  batalhanaval:
    driver: bridge
